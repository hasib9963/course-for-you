<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="styles.css">
    <title>C4U</title>
</head>

<body>
    <!-- header section start  -->
    <header class="bg-white dark:bg-gray-800 md:py-4 py-3 px-3 mx-auto">
        <nav class="container mx-auto flex items-center justify-between">
            <div class="flex items-center gap-1 md:gap-3">
                <a href="#"><img src="images/logo.png" alt="Logo" class="h-8 md:h-10" /></a>
            </div>

            <!-- Desktop Navigation -->
            <div class="hidden md:flex items-center justify-center flex-grow">
                <ul class="flex items-center gap-2 md:gap-7 text-gray-900 dark:text-white">
                    <a href="index.html">
                        <li>Home</li>
                    </a>
                    <li><a href="#">About Us</a></li>
                    <li class="text-[#F44335]"><a href="#">Upskill</a></li>
                    <li><a href="#">Contact us</a></li>
                </ul>
            </div>

            <!-- Right Side: Hamburger and Switch (Mobile) -->
            <div class="flex items-center md:hidden">
                <button id="hamburger" class="text-gray-900 dark:text-white focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16m-7 6h7"></path>
                    </svg>
                </button>
                <button id="mobile-switch" class="ml-2">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-6 dark:stroke-white hover:scale-105 transition">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
                    </svg>
                </button>
            </div>

            <!-- Right Side: Register Interest Button and Switch Icon (Desktop) -->
            <div class="hidden md:flex items-center md:gap-7">
                <button
                    class="bg-[#F44335] md:text-base text-xs md:py-3 py-3 md:px-6 px-2 rounded-md text-white font-semibold hover:bg-green-400 transition hover:scale-105 hover:translate-y-1 cursor-pointer">
                    Register Interest
                </button>
                <button id="desktop-switch" class="ml-2 cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-6 dark:stroke-white hover:scale-105 transition">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
                    </svg>
                </button>
            </div>
        </nav>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="md:hidden hidden">
            <ul class="flex flex-col items-center bg-white dark:bg-gray-800 py-4">
                <a href="index2.html">
                    <li class="py-2">Home</li>
                </a>
                <li class="py-2">About Us</li>
                <li class="py-2 text-[#F44335]">Upskill</li>
                <li class="py-2">Contact us</li>
                <li class="py-2">
                    <button
                        class="bg-[#F44335] w-full md:text-base text-xs py-3 md:px-6 px-2 rounded-md text-white font-semibold hover:bg-green-400 transition hover:scale-105 hover:translate-y-1">
                        Register Interest
                    </button>
                </li>
            </ul>
        </div>

    </header>
    <!-- header section end  -->
</body>

</html>
